name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    uses: groq/github-actions/.github/workflows/claude-code-review.yaml@4e49371dae85ca49699c700f6b6132f8f57df474 # v2.1.0
    permissions:
      actions: read
      contents: read
      pull-requests: write
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
    with:
      trigger_phrase: "@claude review"
      guidance_file: CLAUDE.md
      max_turns: 10
      review_priorities: >-
        critical bugs, security issues and performance problems first, then
        separation of concerns and clear naming, then missing tests for new
        functionality
      extra_instructions: >-
        Be extremely concise. Only raise issues that are blocking or genuinely
        helpful; an approval with no comments is fine.
